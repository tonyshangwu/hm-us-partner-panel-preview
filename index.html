.filters{margin-bottom:13px}.filters input{width:min(100%,660px)}.filters select{max-width:100%;font-size:14px}.table-wrap{overflow:auto;padding:0}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}th,td{padding:12px 14px;border-bottom:1px solid #edf2f3;vertical-align:middle}th{background:#f5f9f8;color:#425961;white-space:nowrap}tr:last-child td{border-bottom:0}.link{border:0;background:transparent;color:#075c51;font-weight:750;padding:0;text-align:left}.board{display:grid;grid-template-columns:repeat(7,minmax(174px,1fr));gap:10px;overflow-x:auto;padding:2px 1px 12px}.lane{border:1px solid #d5e1e3;background:#e8eef0;border-radius:10px;min-height:360px;padding:8px}.lane.over{outline:2px dashed var(--teal);background:#d9eee7}.lane h3{padding:5px 3px 11px;font-size:14px}.card{display:grid;gap:9px;background:white;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:9px;cursor:grab;overflow-wrap:anywhere}.card select{width:100%;font-size:13px;padding:4px 6px}.card .link{font-size:15px;line-height:1.32}.card .row{gap:4px}.empty{padding:21px;color:var(--dim);text-align:center}.lane .empty{font-size:13px;padding:14px 4px}

<body>
<header><div class="wrap row between"><div class="brand"><span class="mark" aria-hidden="true">HM</span><div><h1>寰美海外 · 美国合作企业面板（雏形）</h1><p>本机浏览器存储 · 尚未对接 WorkBuddy / 文案面板</p></div></div><div class="row"><button data-action="data">数据管理</button><button class="primary" data-action="new">＋ 新建企业</button></div></div></header>
<main class="wrap">
<div id="banner" class="banner"></div>
<nav aria-label="视图"><button data-view="overview">总览统计</button><button data-view="board">合作看板</button><button data-view="list">企业列表</button></nav>
<section id="workspace"></section>
</main>
<dialog id="drawer" class="drawer" aria-label="企业详情"></dialog>
<dialog id="modal" aria-label="编辑与数据管理"></dialog>
<div id="notice" role="status"></div>
<script>
'use strict';
const STATUS = {prospect:'意向接洽',diligence:'尽调中',negotiation:'协议洽谈',signed:'已签约',active:'履约中',paused:'暂缓',ended:'已终止'};
const DILIGENCE = {not_started:'未开始',in_progress:'进行中',done:'已完成',risk:'有风险'};
const ROLES = {sponsor:'担保雇主',referral:'渠道转介',other:'其他合作'};
const STAGES = {
  pre:['前期启动','#94a3b8','学历评估、等待资料或暂缓'],
  pwd:['9141 现行工资','#0891b2','9141 制作与递交'],
  ad:['广告招聘','#f59e0b','招聘广告投放'],
  perm:['PERM 劳工证','#3b82f6','递交与等待批复'],
  c140:['I-140 申请','#1d4ed8','制作、待付费或已递交']
};
const MATCH = {none:'未定',tnt:'暂定',ok:'已确定'};
const LINES = {single:'单线',EW:'EW 线',EB:'EB 线'};
const STATES = Object.fromEntries(
  ('AL 阿拉巴马|AK 阿拉斯加|AZ 亚利桑那|AR 阿肯色|CA 加利福尼亚|CO 科罗拉多|CT 康涅狄格|DE 特拉华|FL 佛罗里达|GA 佐治亚|HI 夏威夷|ID 爱达荷|IL 伊利诺伊|IN 印第安纳|IA 艾奥瓦|KS 堪萨斯|KY 肯塔基|LA 路易斯安那|ME 缅因|MD 马里兰|MA 马萨诸塞|MI 密歇根|MN 明尼苏达|MS 密西西比|MO 密苏里|MT 蒙大拿|NE 内布拉斯加|NV 内华达|NH 新罕布什尔|NJ 新泽西|NM 新墨西哥|NY 纽约|NC 北卡罗来纳|ND 北达科他|OH 俄亥俄|OK 俄克拉何马|OR 俄勒冈|PA 宾夕法尼亚|RI 罗得岛|SC 南卡罗来纳|SD 南达科他|TN 田纳西|TX 得克萨斯|UT 犹他|VT 佛蒙特|VA 弗吉尼亚|WA 华盛顿|WV 西弗吉尼亚|WI 威斯康星|WY 怀俄明|DC 哥伦比亚特区').split('|').map(item=>[item.slice(0,2),item.slice(3)])
);
const PATHS = ['EB3','EB2','EW3','EW+EB2','EW+EB3','EB1/NIW'];
const CATEGORIES = ['EB3/本科','EB3/工作经验','EB2/硕士','EW3','EW3+EB2','EW3+EB3','EB1/NIW'];
const MASTER = {
  legalName:'法定名称',dba:'DBA',aliases:'历史名称／别名',ein:'EIN 税号（仅记录）',edd:'EDD',naics:'NAICS 码',industry:'行业',
  yearEstablished:'成立年份',headcount:'员工人数',revenue:'年销售额',addr:'公司地址',city:'城市',state:'注册州',zip:'邮编',website:'网站',
  contact:'主联系人',ctitle:'联系人职位',email:'邮箱',phone:'电话',status:'合作状态',diligence:'尽调状态',owner:'主维护人',
  signedAt:'签署日',effectiveAt:'生效日',renewalAt:'续约日',notes:'备注'
};
const CSV_FIELDS = ['id','name',...Object.keys(MASTER),'roles','createdAt','updatedAt','isDemo'];
const KEY = 'hm-us-partners-v1';
const $ = id => document.getElementById(id);
const str = value => String(value ?? '');
const esc = value => str(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const own = (obj,key) => Object.hasOwn(obj,key);
const now = () => new Date().toISOString();
const uid = () => globalThis.crypto?.randomUUID?.() ?? Array.from(crypto.getRandomValues(new Uint32Array(4)),n=>n.toString(16).padStart(8,'0')).join('');
const companyId = seq => 'HM-US-'+String(seq).padStart(4,'0');
const caseCount = company => new Set(company.caseLinks.map(link=>link.caseId)).size;
const pending = company => ['not_started','in_progress'].includes(company.diligence);
const flagged = company => company.status==='paused' || company.diligence==='risk';
const stateName = state => state ? state+' · '+STATES[state] : '未填写';
function options(map,selected,placeholder) {
  return (placeholder === undefined ? '' : '<option value="">'+esc(placeholder)+'</option>') +
    Object.entries(map).map(([key,label])=>`<option value="${esc(key)}" ${key===selected?'selected':''}>${esc(label)}</option>`).join('');
}
const choiceMap = values => Object.fromEntries(values.map(value=>[value,value]));
const pills = roles => roles.map(role=>`<span class="pill ${role}">${ROLES[role]}</span>`).join(' ') || '<small>未设置角色</small>';

function demoCompanies() {
  const seed = [
    ['雾杉星轨制造','CA','虚构城 A','精密制造','active','done',['sponsor','referral'],'示例维护人甲','质量工程师','EB3'],
    ['蓝砾牧云食品','TX','虚构城 B','食品加工','signed','done',['sponsor'],'示例维护人乙','包装操作员','EW3'],
    ['潮汐鹿角物流','WA','虚构城 C','仓储物流','negotiation','in_progress',['sponsor','other'],'示例维护人甲','仓储主管','EB3'],
    ['纸舟曜石数据','NY','虚构城 D','数据服务','diligence','in_progress',['sponsor'],'示例维护人丙','数据分析师','EB2'],
    ['银雀云帆咨询','IL','虚构城 E','商务咨询','prospect','not_started',['referral'],'示例维护人乙'],
    ['棱镜苔原设备','AZ','虚构城 F','工业设备','paused','risk',['sponsor'],'示例维护人丙','设备技术员','EW+EB3'],
    ['橙羽环月工作室','CA','虚构城 G','创意服务','ended','done',['other'],'示例维护人甲'],
    ['雪盐彗尾系统','WA','虚构城 H','自动化服务','active','done',['sponsor','other'],'示例维护人乙','自动化工程师','EB2']
  ];
  const date = '2026-11-18T18:00:00.000Z';
  const links = [
    [[1,'EB','EW3+EB3','perm','ok'],[2,'single','EB3/本科','pwd','ok'],[3,'single','EB3/工作经验','ad','tnt'],[4,'single','EB3/本科','c140','ok']],
    [[5,'single','EW3','pre','tnt'],[6,'single','EW3','ad','ok']],
    [[7,'single','EB3/工作经验','pre','none']],
    [],[],[[1,'EW','EW3+EB3','perm','ok']],[],
    [[8,'EB','EW3+EB2','pwd','tnt'],[9,'single','EB2/硕士','c140','ok']]
  ];
  return seed.map(([label,state,city,industry,status,diligence,roles,owner,title,projectPath],i)=>{
    const legalName = '示例 · '+label+' LLC';
    const positionId = 'DEMO-POS-'+(i+1);
    const signed = ['signed','active'].includes(status);
    return {
      id:companyId(i+1),legalName,name:legalName,dba:'示例 · '+label,aliases:['示例旧称 '+label],ein:'XX-XXXXXXX',edd:'示例占位',
      naics:['332710','311999','493110','518210','541611','333999','541430','541330'][i],industry,yearEstablished:2010+i,
      headcount:35+i*13,revenue:'USD '+(2+i)+'M（示例）',addr:'虚构示范大道 '+(100+i)+' 号',city,state,zip:'00000',
      website:`https://partner-${i+1}.example.invalid`,contact:'示例联系人 '+String.fromCharCode(65+i),ctitle:'合作协调员',
      email:`contact-${i+1}@example.invalid`,phone:'+1 202-555-01'+String(i).padStart(2,'0'),
      contacts:i===0?[{id:'DEMO-CONTACT-1',name:'示例联系人 J',title:'岗位协调员',email:'jobs@example.invalid',phone:'+1 202-555-0110',isPrimary:false}]:[],
      roles,status,diligence,owner,signedAt:signed?'2026-10-20':'',effectiveAt:signed?'2026-11-01':'',renewalAt:signed?'2027-11-01':'',
      notes:status==='paused'?'示例记录：等待补充经营材料。':'示例记录：已整理合作概况，待维护人确认下一步。',
      positions:title?[{id:positionId,title,location:city,state,projectPath,wageLevel:'Level '+(i===1?'I':'II'),wageAmount:i===1?'USD 21 / 小时':'USD 78,000 / 年',slots:3+i,notes:'示例岗位与工资占位'}]:[],
      caseLinks:links[i].map(([n,line,category,stage,matchStatus])=>({
        caseId:'WRITER-DEMO-'+String(n).padStart(3,'0'),clientLabel:'示例客户 '+String.fromCharCode(64+n),line,category,stage,matchStatus,positionId,updatedAt:date
      })),
      timeline:[
        {id:'DEMO-FOLLOW-'+i,at:date,action:signed?'合作例行沟通':'合作资料跟进',note:'已核对本轮待办，并记录下一次沟通。',nextFollowUp:status==='ended'?'':'2026-11-27',actor:owner},
        {id:'DEMO-START-'+i,at:'2026-10-15T18:00:00.000Z',action:'建立企业主档',note:'整理初次接洽摘要。',nextFollowUp:'',actor:owner}
      ],
      createdAt:'2026-10-15T18:00:00.000Z',updatedAt:date,isDemo:true
    };
  });
}
function initialData() {
  const companies = demoCompanies();
  return {schemaVersion:1,nextId:companies.length+1,companies};
}
let data, storageError = '';
try {
  const saved = localStorage.getItem(KEY);
  data = saved ? JSON.parse(saved) : initialData();
  if (data?.schemaVersion!==1 || !Array.isArray(data.companies) || !Number.isSafeInteger(data.nextId) || data.nextId<1) {
    throw new Error('无效的本机记录');
  }
} catch {
  data = initialData();
  storageError = '无法读取本机存储。当前显示示例，请先导出备份或检查浏览器设置。';
}
let view = 'overview', detailId = '', drill = null, filter = {}, noticeTimer;
let importDraft = null;
const workspace = $('workspace'), drawer = $('drawer'), modal = $('modal');
function notify(message) {
  $('notice').textContent = message;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(()=>{$('notice').textContent='';},4500);
}
function fail(error) {
  const area = modal.open && modal.querySelector('.error');
  if (area) area.textContent = error.message;
  else notify(error.message);
}
function persist(next) {
  try { localStorage.setItem(KEY,JSON.stringify(next)); }
  catch { throw new Error('保存失败，请检查浏览器存储设置或容量。当前更改尚未写入。'); }
  data = next;
  storageError = '';
  render();
  if (drawer.open) renderDetail();
}
function updateCompany(id,change) {
  const next = structuredClone(data);
  const company = next.companies.find(row=>row.id===id);
  if (!company) throw new Error('找不到这家企业。');
  change(company);
  company.updatedAt = now();
  persist(next);
}
function allocateId(next) {
  if (!Number.isSafeInteger(next.nextId) || next.nextId>=Number.MAX_SAFE_INTEGER) throw new Error('企业编号已达上限。');
  return companyId(next.nextId++);
}
function addStatus(company,status) {
  if (company.status===status) return;
  company.timeline.push({id:uid(),at:now(),action:'更新合作状态',note:STATUS[company.status]+' → '+STATUS[status],actor:company.owner||'本地操作',nextFollowUp:''});
  company.status = status;
}
function changeStatus(id,status) {
  if (!own(STATUS,status)) return;
  if (data.companies.find(company=>company.id===id)?.status===status) return;
  updateCompany(id,company=>addStatus(company,status));
  notify('合作状态已保存，并记录到跟进时间线。');
}
function switchView(target) {
  view = target;
  drill = null;
  filter = {};
  render();
}
function summary(companies) {
  const counts = new Set(companies.flatMap(company=>company.caseLinks.map(link=>link.caseId)));
  const totals = [
    ['all','','企业总数',companies.length,'按企业 ID 计数'],
    ['cases','yes','在办关联案件',counts.size,'跨企业、跨线路按案件 ID 去重'],
    ['pending','','待尽调',companies.filter(pending).length,'尽调未开始或进行中'],
    ['flagged','','暂缓 / 有风险',companies.filter(flagged).length,'合作暂缓或尽调有风险，按企业去重']
  ];
  const blocks = [
    ['按合作状态','status',Object.entries(STATUS),(c,k)=>c.status===k],
    ['按州','state',[...new Set(companies.map(c=>c.state))].sort().map(key=>[key||'_blank',stateName(key)]),(c,k)=>(c.state||'_blank')===k],

function companyPaths(company) {

function csvCell(value) {
  let cell = str(Array.isArray(value)?JSON.stringify(value):value);

  if (/^(?:\s*[=+\-@]|[\t\r\n]|')/.test(cell)) cell = "'"+cell;

}

function parseCsv(contents) {
  const rows = [];
  const source = contents.replace(/^\ufeff/,'');
  let row = [], cell = '', quoted = false, closed = false;
  for (let i=0;i<source.length;i++) {
    const char = source[i];
    if (quoted) {
      if (char!=='"') cell += char;
      else if (source[i+1]==='"') {cell+='"';i++;}
      else {quoted=false;closed=true;}
    } else if (char===',' || char==='\r' || char==='\n') {
      row.push(cell);cell='';closed=false;
      if (char!==',') {
        rows.push(row);row=[];
        if (char==='\r' && source[i+1]==='\n') i++;
      }
    } else if (closed || (char==='"' && cell)) throw new Error('CSV 引号格式有误。');
    else if (char==='"') quoted=true;
    else cell+=char;
  }
  if (quoted) throw new Error('CSV 有未闭合的引号。');
  if (row.length||cell||closed) rows.push([...row,cell]);
  const headers = (rows.shift()||[]).map(key=>key.trim());
  if (new Set(headers).size!==headers.length || !headers.some(key=>['legalName','name'].includes(key))) {
    throw new Error('CSV 表头需要 legalName 或 name，且列名不能重复。');
  }
  return rows.filter(values=>values.some(Boolean)).map((values,i)=>{
    if (values.length!==headers.length) throw new Error('CSV 数据第 '+(i+1)+' 条的列数与表头不符。');
    const record = Object.fromEntries(headers.map((key,index)=>{
      const value = values[index];
      return [key,/^'(?:\s*[=+\-@]|[\t\r\n]|')/.test(value)?value.slice(1):value];
    }));
    for (const key of ['roles','aliases']) {
      if (own(record,key)) record[key] = record[key].trim().startsWith('[')?JSON.parse(record[key]):record[key].split(/[|、]/).map(s=>s.trim()).filter(Boolean);
    }
    if (own(record,'isDemo')) record.isDemo = ['true','1'].includes(record.isDemo.toLowerCase());
    return record;
  });
}

function object(value,label) {

function subrecords(source,label,convert,key) {
  const result = array(source,label).map(value=>convert(object(value,label)));
  if (new Set(result.map(key)).size!==result.length) throw new Error(label+'存在重复 ID 或案件线路。');
  return result;
}
function normalizeCompany(source,base={}) {
  const merged = {...base,...source};
  const legalName = (str(source.legalName).trim() || str(source.name).trim() || str(base.legalName).trim());
  if (!legalName) throw new Error('企业法定名称不能为空。');
  const row = Object.fromEntries(Object.keys(MASTER).map(key=>[key,str(merged[key]).trim()]));
  const aliases = array(merged.aliases??[],'别名').map(value=>str(value).trim()).filter(Boolean);
  if (base.legalName && base.legalName!==legalName) aliases.push(base.legalName);
  Object.assign(row,{
    legalName,name:legalName,aliases:[...new Set(aliases)].filter(a=>a!==legalName),
    state:row.state?enumValue(STATES,row.state.toUpperCase(),'注册州'):'',
    status:enumValue(STATUS,row.status,'合作状态','prospect'),
    diligence:enumValue(DILIGENCE,row.diligence,'尽调状态','not_started'),
    roles:[...new Set(array(merged.roles??[],'合作角色').map(key=>enumValue(ROLES,key,'合作角色')))],
    isDemo:merged.isDemo===true,createdAt:timestamp(merged.createdAt),updatedAt:timestamp(merged.updatedAt)
  });
  row.contacts = subrecords(merged.contacts??[],'额外联系人',c=>({
    id:str(c.id)||uid(),name:str(c.name),title:str(c.title),email:str(c.email),phone:str(c.phone),isPrimary:c.isPrimary===true
  }),c=>c.id);
  row.positions = subrecords(merged.positions??[],'岗位',p=>{
    const slots = Number(p.slots??0);
    if (!str(p.title).trim() || !Number.isSafeInteger(slots) || slots<0) throw new Error('岗位需要职位及非负整数名额。');
    return {...Object.fromEntries(Object.keys(POS).map(k=>[k,str(p[k])])),id:str(p.id)||uid(),title:str(p.title).trim(),
      state:p.state?enumValue(STATES,str(p.state).toUpperCase(),'岗位州'):'',slots};
  },p=>p.id);
  const positionIds = new Set(row.positions.map(p=>p.id));
  row.caseLinks = subrecords(merged.caseLinks??[],'关联案件',l=>{
    if (!str(l.caseId).trim()) throw new Error('关联案件缺少案件 ID。');
    if (l.positionId && !positionIds.has(str(l.positionId))) throw new Error('关联案件引用了不存在的岗位。');
    return {caseId:str(l.caseId).trim(),clientLabel:str(l.clientLabel),line:enumValue(LINES,l.line,'线路','single'),
      category:str(l.category),stage:enumValue(STAGES,l.stage,'案件阶段','pre'),matchStatus:enumValue(MATCH,l.matchStatus,'匹配状态','none'),
      positionId:str(l.positionId),updatedAt:timestamp(l.updatedAt)};
  },linkKey);
  row.timeline = subrecords(merged.timeline??[],'跟进时间线',t=>({
    ...Object.fromEntries(Object.keys(FOLLOW).map(k=>[k,str(t[k])])),id:str(t.id)||uid(),at:timestamp(t.at)
  }),t=>t.id);
  return row;
}
function planImport(draft,mode) {
  const merge = mode==='merge';
  const records = draft.records;
  const reserved = new Set();
  for (const record of records) {
    object(record,'企业记录');
    const id = str(record.id).trim();
    if (!id) continue;
    const number = Number(id.slice(6));
    if (!/^HM-US-\d{4,}$/.test(id) || !Number.isSafeInteger(number) || number<1 || number>=Number.MAX_SAFE_INTEGER || companyId(number)!==id) {
      throw new Error('企业 ID 格式无效，应为 HM-US-0001 一类的编号。');
    }
    if (reserved.has(id)) throw new Error('导入文件中的企业 ID 重复。');
    reserved.add(id);
  }
  const current = new Map(data.companies.map(c=>[c.id,c]));
  let nextId = Math.max(data.nextId,draft.nextId||1);
  for (const id of reserved) nextId = Math.max(nextId,Number(id.slice(6))+1);
  const counter = {nextId};
  const result = merge ? new Map(current) : new Map();
  let added=0, updated=0;
  for (const record of records) {
    const id = str(record.id).trim() || allocateId(counter);
    const base = merge ? current.get(id) : undefined;
    const company = {...normalizeCompany(record,base),id};
    result.set(id,company);
    if (base) updated++;
    else added++;
  }
  return {next:{schemaVersion:1,nextId:counter.nextId,companies:[...result.values()]},added,updated};
}
function manageData() {
  importDraft = null;
  showModal('数据管理',`<div class="dialog-body stack">
    ${section('导出备份','<div class="row">'+add('json','导出完整 JSON')+add('csv','导出企业 CSV')+'</div><p class="muted">JSON 含岗位、案件和时间线。CSV 只含企业主档。</p>')}
    ${section('导入本地文件','<input id="import-file" type="file" accept=".json,.csv" aria-label="选择 JSON 或 CSV"><div id="import-preview"></div><p class="error" role="alert"></p>')}
    ${section('恢复或清空','<div class="row">'+add('restore','恢复示例数据')+'<button class="danger" data-action="clear">清空本地数据</button></div><p class="muted">两项操作都会替换当前企业与关联数据，并要求确认。</p>')}
  </div>`);
}
async function prepareImport(file) {
  importDraft = null;
  const preview = $('import-preview');
  if (!preview) return;
  preview.innerHTML = '';
  modal.querySelector('.error').textContent = '';
  if (!file) return;
  const contents = await file.text();
  if (preview!==$('import-preview') || $('import-file').files[0]!==file) return;
  let nextId = 1, records;
  const csv = /\.csv$/i.test(file.name);
  if (csv) records = parseCsv(contents);
  else {
    const parsed = JSON.parse(contents.replace(/^\ufeff/,''));
    if (Array.isArray(parsed)) records = parsed;
    else {
      object(parsed,'JSON');
      if (parsed.schemaVersion!==undefined && parsed.schemaVersion!==1) throw new Error('此 JSON 版本暂不支持。');
      records = array(parsed.companies,'companies');
      if (Number.isSafeInteger(parsed.nextId)&&parsed.nextId>0&&parsed.nextId<Number.MAX_SAFE_INTEGER) nextId=parsed.nextId;
    }
  }
  const draft = {records,nextId};
  const plan = planImport(draft,'merge');
  importDraft = draft;
  preview.innerHTML = `<div class="import-actions stack"><p>读取 ${records.length} 家企业。合并预计新增 ${plan.added} 家、更新 ${plan.updated} 家。</p>
    <p class="muted">合并按企业 ID 匹配，保留未提供的字段。无 ID 时分配新号。覆盖会删除当前企业及其关联数据。${csv?' CSV 覆盖只恢复主档。':''}</p>
    <div class="row">${add('merge','合并导入')}${add('overwrite','覆盖导入')}</div></div>`;
}
function applyImport(mode) {
  if (!importDraft) return;
  const plan = planImport(importDraft,mode);
  const message = mode==='merge'
    ? `确认新增 ${plan.added} 家、更新 ${plan.updated} 家企业？同 ID 记录的导入字段会覆盖当前值。`
    : `确认移除当前 ${data.companies.length} 家企业及其本地关联，并以文件中的 ${plan.added} 家企业替换？`;
  if (!confirm(message)) return;
  persist(plan.next);
  switchView('list');
  modal.close();
  importDraft = null;
  notify('导入完成。');
}
document.addEventListener('click',event=>{
  const button = event.target.closest('button');
  if (!button) return;
  const {action,view:target,open,drill:group,value,label,item} = button.dataset;
  try {
    if (target) switchView(target);
    if (open) openDetail(open);
    if (group) {
      view = 'list';
      drill = {group,label};
      filter = ['status','state','role','cases'].includes(group)?{[group]:value}:{};
      render();
    }
    if (action==='close') button.closest('dialog').close();
    if (action==='reset-filter') switchView(view);
    if (action==='new') editCompany();
    if (action==='data') manageData();
    if (action==='json') download('美国合作企业-完整备份.json','application/json',JSON.stringify(data,null,2));
    if (action==='csv') exportCsv();
    if (action==='merge') applyImport('merge');
    if (action==='overwrite') applyImport('overwrite');
    if (action==='restore' && confirm('恢复示例数据将替换当前所有企业及关联数据。确认恢复？')) {
      const next = initialData();
      next.nextId = Math.max(next.nextId,data.nextId);
      persist(next); switchView('overview'); modal.close(); notify('已恢复示例数据。');
    }
    if (action==='clear' && confirm('确认清空当前所有企业及关联数据？可通过备份恢复。')) {
      persist({...data,companies:[]}); switchView('overview'); modal.close(); notify('本地数据已清空。');
    }
    const c = data.companies.find(row=>row.id===detailId);
    if (!c) return;
    if (action==='edit') editCompany(c);
    if (action==='position') editPosition(c,item);
    if (action==='case') editCase(c,item);
    if (action==='follow') editFollow(c);
    if (action==='remove-position' && confirm('删除该岗位？相关案件仍保留，岗位引用会清除。')) {
      updateCompany(c.id,row=>{
        row.positions = row.positions.filter(p=>p.id!==item);
        for (const link of row.caseLinks.filter(l=>l.positionId===item)) {
          link.positionId='';link.updatedAt=now();
        }
      });
      notify('岗位已删除。');
    }
    if (action==='remove-case' && confirm('移除这条本地案件关联？')) {
      updateCompany(c.id,row=>{row.caseLinks=row.caseLinks.filter(link=>linkKey(link)!==item);});
      notify('案件关联已移除。');
    }
  } catch(error) {fail(error);}
});
workspace.addEventListener('input',event=>{
  if (event.target.id==='search') {filter.q=event.target.value;renderResults();}
});
document.addEventListener('change',event=>{
  const el = event.target;
  if (el.dataset.filter) {
    if (drill?.group===el.dataset.filter) drill=null;
    filter[el.dataset.filter]=el.value;
    if (!drill) workspace.querySelector('#result-count + .pill')?.remove();
    renderResults();
  }
  if (el.dataset.status) {
    try {changeStatus(el.dataset.status,el.value);}
    catch(error) {renderResults();fail(error);}
  }
  if (el.id==='import-file') prepareImport(el.files[0]).catch(fail);
});
let dragging = '';
function clearDrag() {
  dragging='';
  workspace.querySelectorAll('.lane.over').forEach(lane=>lane.classList.remove('over'));
}
workspace.addEventListener('dragstart',event=>{
  const card = event.target.closest('[data-card]');
  if (!card) return;
  dragging=card.dataset.card;
  event.dataTransfer.setData('text/plain',dragging);
  event.dataTransfer.effectAllowed='move';
});
workspace.addEventListener('dragover',event=>{
  const lane = event.target.closest('[data-lane]');
  if (!dragging || !lane) return;
  event.preventDefault();
  event.dataTransfer.dropEffect='move';
  workspace.querySelectorAll('.lane.over').forEach(previous=>previous.classList.toggle('over',previous===lane));
  lane.classList.add('over');
});
workspace.addEventListener('dragleave',event=>{
  const lane = event.target.closest('[data-lane]');
  if (lane && !lane.contains(event.relatedTarget)) lane.classList.remove('over');
});
workspace.addEventListener('drop',event=>{
  const lane = event.target.closest('[data-lane]');
  if (!lane || !dragging) return;
  event.preventDefault();
  const id = dragging;
  clearDrag();
  if (data.companies.find(c=>c.id===id)?.status===lane.dataset.lane) return;
  try {changeStatus(id,lane.dataset.lane);}
  catch(error) {fail(error);}
});
workspace.addEventListener('dragend',clearDrag);
render();
</script>
